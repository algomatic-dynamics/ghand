[project]
name = "lerobot_robot_ghand"
version = "0.1.0"
description = "LeRobot robot plugin for the LEAP V1 KAIZEN hand; installs auto-discovery of --robot.type=ghand."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "ghand[lerobot]",
]

[tool.uv.sources]
ghand = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
