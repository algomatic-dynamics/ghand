name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev --extra teleop --extra viewer --extra sim

      - name: Lint
        run: uv run ruff check src tests examples scripts

      - name: Type-check the base packages
        run: uv run mypy src/ghand/hand src/ghand/hardware src/ghand/control src/ghand/safety

      - name: Test
        # Typer renders help with terminal styling when GITHUB_ACTIONS is set;
        # keep the captured CLI output plain so the help-text assertions hold.
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run pytest -q
